services:
  - type: web
    name: doomlater-bot-bridge
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: FIREBASE_DB_URL
        value: https://ok-gogle-c018c-default-rtdb.firebaseio.com
      - key: META_VERIFY_TOKEN
        value: doomlater_meta_secret_2026
      - key: GEMINI_API_KEY
        sync: false
