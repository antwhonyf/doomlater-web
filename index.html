<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0e14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Doomlater" />
  <title>Doomlater</title>

  <!-- PWA Manifest & Official Logos for Chrome Android, iOS & Desktop -->
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
  <link rel="apple-touch-icon" href="./logo.jpg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" id="appFavicon192" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png" id="appFavicon512" />
  <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
  <link rel="icon" type="image/jpeg" href="./logo.jpg" id="appFavicon" />
  <link rel="shortcut icon" href="./logo.jpg" id="appFaviconShortcut" />

  <!-- Google Fonts: DM Sans, Plus Jakarta Sans, Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />

  <!-- Material Symbols Rounded (Cashew's exact icon family) -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..700,0..1,-50..200" rel="stylesheet" />

  <!-- Cashew Material You Stylesheet -->
  <link rel="stylesheet" href="./css/cashew.css?v=20261102v9" />
</head>
<body>

  <!-- Toast Notifications Stack -->
  <div id="cashewToastStack" class="toast-stack"></div>

  <!-- ====================================================================
       DOOMLATER.CORP MATERIAL YOU LOGIN / PROFILE LOCK OVERLAY
       ==================================================================== -->
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-logo-circle" style="background:transparent; border:none; box-shadow:none;">
          <img id="authBrandLogoImg" src="./logo.jpg" alt="Doomlater Logo" style="width:58px; height:58px; border-radius:16px; object-fit:contain;" />
        </div>
        <h1 class="auth-title">Doomlater</h1>
        <p class="auth-subtitle">Finanzas, Stock & Operaciones Compartidas</p>
      </div>

      <!-- Dynamic Partner Selector (Synced with Firebase profiles) -->
      <div id="loginProfilesGrid" class="profile-selector-grid">
        <button type="button" class="profile-pick-card active" data-slot="profile_1"
                onclick="CashewApp.selectLoginSlot('profile_1')">
          <div class="profile-avatar">D1</div>
          <div class="profile-pick-name">doom1</div>
          <div class="profile-pick-role">Socio Principal</div>
        </button>

        <button type="button" class="profile-pick-card" data-slot="profile_2"
                onclick="CashewApp.selectLoginSlot('profile_2')">
          <div class="profile-avatar">D2</div>
          <div class="profile-pick-name">doom2</div>
          <div class="profile-pick-role">Socio & Operaciones</div>
        </button>
      </div>

      <div id="loginError" class="auth-error">
        <span class="material-symbols-rounded" style="font-size:18px;">error</span>
        <span id="loginErrorText">Usuario o clave incorrectos. Verifica tus datos.</span>
      </div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label class="form-label" for="loginUsername">Usuario del Perfil</label>
          <input id="loginUsername" class="cashew-input" type="text" value="doom1" placeholder="Ingresa tu usuario" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Clave de Acceso</label>
          <div style="position:relative;">
            <input id="loginPassword" class="cashew-input" type="password" placeholder="Ingresa tu clave" required style="padding-right:44px;" />
            <button type="button"
                    onclick="const i=document.getElementById('loginPassword'); i.type=i.type==='password'?'text':'password';"
                    style="position:absolute; right:10px; top:50%; transform:translateY(-50%); color:var(--text-muted); padding:4px;">
              <span class="material-symbols-rounded" style="font-size:19px;">visibility</span>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-cashew btn-primary" style="width:100%; padding:14px; font-size:15px; margin-top:4px;">
          <span class="material-symbols-rounded">lock_open</span>
          Entrar al Espacio Privado
        </button>
      </form>

      <div class="auth-sync-note">
        <span id="loginSyncDot" class="pulse-dot"></span>
        <span id="loginSyncLabel">Nube privada conectada automáticamente</span>
      </div>
    </div>
  </div>

  <!-- ====================================================================
       CASHEW APP SHELL (Desktop NavigationSidebar + Main View + Mobile Nav)
       ==================================================================== -->
  <div id="appShell" class="app-shell">

    <!-- Left Navigation Sidebar (Exact Cashew navigationSidebar.dart style) -->
    <aside class="cashew-sidebar">
      <!-- Corporate Brand Header -->
      <div class="sidebar-brand-header" style="display:flex; align-items:center; gap:10px; padding:16px 16px 6px 16px;">
        <img id="sidebarBrandLogoImg" src="./logo.jpg" alt="Doomlater" style="width:34px; height:34px; border-radius:10px; flex-shrink:0; object-fit:contain;" />
        <div class="sidebar-brand-text" style="overflow:hidden; white-space:nowrap;">
          <div style="font-weight:900; font-size:16px; letter-spacing:-0.02em; color:var(--text-main); line-height:1.15;">Doom<span style="color:var(--primary);">late</span></div>
          <div style="font-size:10px; font-weight:800; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.06em;">Finanzas & Stock</div>
        </div>
      </div>

      <div class="sidebar-top-clock">
        <div class="clock-text-wrap">
          <div id="sidebarClockTime" class="clock-digits">12:00</div>
          <div id="sidebarClockDate" class="clock-date">dom, 1 nov</div>
        </div>
        <button class="sidebar-collapse-btn" title="Contraer / Expandir barra" onclick="CashewApp.toggleSidebar()">
          <span class="material-symbols-rounded">menu_open</span>
        </button>
      </div>

      <!-- Real-Time Private Cloud Sync & Partner Presence Box -->
      <div class="sync-status-card" style="cursor:pointer;" title="Nube privada sincronizada en vivo" onclick="CashewApp.onManualSyncClick()">
        <div class="sync-row-top">
          <div class="sync-indicator">
            <span id="syncPulseDot" class="pulse-dot"></span>
            <span id="syncStatusText">Nube en Vivo</span>
          </div>
          <button onclick="event.stopPropagation(); CashewApp.onManualSyncClick()" title="Refrescar sincronización" style="color:var(--text-muted);">
            <span class="material-symbols-rounded" style="font-size:17px;">sync</span>
          </button>
        </div>
        <div class="sync-meta">
          <span id="partnerPresenceBadge" class="partner-presence-pill">Socio offline</span>
          <span id="syncLastTime">Activo</span>
        </div>
      </div>

      <!-- Navigation Links -->
      <nav class="sidebar-nav-list">
        <button class="nav-item-btn active" data-nav="home" onclick="CashewApp.navigate('home')">
          <span class="material-symbols-rounded">home</span>
          <span class="nav-label">Inicio</span>
        </button>

        <button class="nav-item-btn" data-nav="stock" onclick="CashewApp.navigate('stock')">
          <span class="material-symbols-rounded">inventory_2</span>
          <span class="nav-label">Stock y Ventas</span>
          <span id="navStockBadge" class="nav-item-badge">0</span>
        </button>

        <button class="nav-item-btn" data-nav="transactions" onclick="CashewApp.navigate('transactions')">
          <span class="material-symbols-rounded">payments</span>
          <span class="nav-label">Transacciones</span>
        </button>

        <button class="nav-item-btn" data-nav="obligations" onclick="CashewApp.navigate('obligations')">
          <span class="material-symbols-rounded">event_repeat</span>
          <span class="nav-label">Próximos y Deudas</span>
          <span id="navObligationsBadge" class="nav-item-badge" style="display:none;">0</span>
        </button>

        <button class="nav-item-btn" data-nav="budgets" onclick="CashewApp.navigate('budgets')">
          <span class="material-symbols-rounded">donut_small</span>
          <span class="nav-label">Presupuestos</span>
        </button>

        <button class="nav-item-btn" data-nav="goals" onclick="CashewApp.navigate('goals')">
          <span class="material-symbols-rounded">savings</span>
          <span class="nav-label">Metas</span>
        </button>

        <div class="nav-section-divider"></div>

        <button class="nav-item-btn" data-nav="analytics" onclick="CashewApp.navigate('analytics')">
          <span class="material-symbols-rounded">donut_large</span>
          <span class="nav-label">Estadísticas y Mapa</span>
        </button>

        <button class="nav-item-btn" data-nav="accounts" onclick="CashewApp.navigate('accounts')">
          <span class="material-symbols-rounded">account_balance_wallet</span>
          <span class="nav-label">Cuentas y Categorías</span>
        </button>

        <button class="nav-item-btn" data-nav="profile" onclick="CashewApp.navigate('profile')">
          <span class="material-symbols-rounded">forum</span>
          <span class="nav-label">Perfil y Chat</span>
          <span id="navChatBadge" class="nav-item-badge warn" style="display:none;">0</span>
        </button>

        <button class="nav-item-btn" data-nav="bot" onclick="CashewApp.navigate('bot')">
          <span class="material-symbols-rounded">smart_toy</span>
          <span class="nav-label">Bot & Inbox</span>
          <span id="navBotBadge" class="nav-item-badge warn" style="display:none;">0</span>
        </button>

        <button class="nav-item-btn" data-nav="settings" onclick="CashewApp.navigate('settings')">
          <span class="material-symbols-rounded">settings</span>
          <span class="nav-label">Más / Ajustes</span>
        </button>
      </nav>

      <!-- Active Profile Footer -->
      <div class="sidebar-profile-footer">
        <div class="profile-mini-info" style="cursor:pointer; flex:1;" title="Abrir Perfil y Chat" onclick="CashewApp.navigate('profile')">
          <div id="sidebarProfileAvatar" class="profile-mini-avatar">D1</div>
          <div class="profile-mini-text">
            <div id="sidebarProfileName" class="profile-mini-name">doom1</div>
            <div id="sidebarProfileRole" class="profile-mini-sub">Socio Principal</div>
          </div>
        </div>
        <button class="icon-btn" style="width:32px;height:32px;border-radius:10px;"
                title="Cambiar perfil / Cerrar sesión"
                onclick="CashewApp.logout()">
          <span class="material-symbols-rounded" style="font-size:17px;">logout</span>
        </button>
      </div>
    </aside>

    <!-- Main Dynamic View Container -->
    <main id="cashewMainContent" class="cashew-main"></main>

    <!-- Quick Floating Partner Chat Button (With Unread Counter) -->
    <button id="floatingChatFab" class="chat-fab-btn" title="Chat en tiempo real entre perfiles" onclick="CashewApp.openQuickChatModal()">
      <span class="material-symbols-rounded" style="font-size:24px;">chat</span>
      <span id="fabChatBadge" class="chat-unread-badge" style="display:none;">0</span>
    </button>

    <!-- Cashew Rounded-Square Floating Action Button (+) -->
    <button class="cashew-fab" title="Acción rápida (+)" onclick="CashewApp.onFabClick()">
      <span class="material-symbols-rounded">add</span>
    </button>

    <!-- Mobile Material You Bottom Navigation Bar -->
    <nav class="mobile-bottom-nav">
      <button class="mob-nav-btn active" data-nav="home" onclick="CashewApp.navigate('home')">
        <span class="mob-nav-pill"><span class="material-symbols-rounded">home</span></span>
        <span>Inicio</span>
      </button>
      <button class="mob-nav-btn" data-nav="stock" onclick="CashewApp.navigate('stock')">
        <span class="mob-nav-pill"><span class="material-symbols-rounded">inventory_2</span></span>
        <span>Stock</span>
      </button>
      <button class="mob-nav-btn" data-nav="transactions" onclick="CashewApp.navigate('transactions')">
        <span class="mob-nav-pill"><span class="material-symbols-rounded">payments</span></span>
        <span>Finanzas</span>
      </button>
      <button class="mob-nav-btn" data-nav="profile" onclick="CashewApp.navigate('profile')">
        <span class="mob-nav-pill" style="position:relative;">
          <span class="material-symbols-rounded">forum</span>
          <span id="mobChatBadge" class="chat-unread-badge" style="display:none; top:-4px; right:2px; min-width:17px; height:17px; font-size:10px;">0</span>
        </span>
        <span>Chat</span>
      </button>
      <button class="mob-nav-btn" data-nav="settings" onclick="CashewApp.navigate('settings')">
        <span class="mob-nav-pill"><span class="material-symbols-rounded">more_horiz</span></span>
        <span>Más</span>
      </button>
    </nav>

  </div>

  <!-- Official Google Firebase Realtime Database WebSocket SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

  <!-- Official SQLite3 WebAssembly (sql.js) for Original Cashew .sql Import & Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>

  <!-- Core Application Engines (Strict Dependency Order) -->
  <script src="./js/firebaseConfig.js"></script>
  <script src="./js/seedData.js"></script>
  <script src="./js/currencyEngine.js"></script>
  <script src="./js/syncEngine.js"></script>
  <script src="./js/cashewBackup.js"></script>
  <script src="./js/charts.js"></script>
  <script src="./js/app.js?v=20261102v9"></script>
</body>
</html>
